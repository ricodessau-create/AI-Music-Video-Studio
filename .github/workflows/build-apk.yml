name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses and install required packages
        run: |
          SDKMANAGER_PATH=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "sdkmanager wurde unter $ANDROID_HOME/cmdline-tools nicht gefunden"
            find "$ANDROID_HOME" -maxdepth 5 -iname "sdkmanager*" 2>/dev/null
            exit 1
          fi
          echo "Verwende sdkmanager unter: $SDKMANAGER_PATH"
          yes | "$SDKMANAGER_PATH" --licenses || true
          "$SDKMANAGER_PATH" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Run unit tests
        run: gradle test
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
